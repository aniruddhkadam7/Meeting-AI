# Fly.io deploy config for REDLY Cloud's FastAPI backend — a single small
# container, no autoscaling, suitable for the 10-50 user beta. Not activated
# until `fly launch`/`fly deploy` is run by hand; this file just makes that a
# one-command operation once a Fly.io account/app exists.
#
# Setup:
#   1. `fly launch --no-deploy` from this directory (apps/backend) to create
#      the app and confirm/adjust the generated `app` name below.
#   2. `fly secrets set SUPABASE_URL=... SUPABASE_ANON_KEY=... \
#        SUPABASE_JWT_SECRET=... SUPABASE_SERVICE_ROLE_KEY=... \
#        OPENAI_API_KEY=... LLM_PROVIDER=openai \
#        CORS_ALLOW_ORIGINS=tauri://localhost,https://tauri.localhost`
#   3. `fly deploy`

app = "redly-cloud-backend"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
